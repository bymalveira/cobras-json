<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cobras e Sorocabos do Ceará</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <header>
      <h1>Fauna e Saúde do Ceará</h1>
      <p>
        Informações sobre cobras da Caatinga e pontos de atendimento médico para
        acidentes.
      </p>
    </header>

    <main>
      <!-- Banner de status do filtro (exibido quando clicar em "Fui picado por esta cobra") -->
      <div id="status-filtro" class="status-filtro" style="display: none">
        <span id="texto-filtro"></span>
        <button onclick="limparFiltro()" class="btn-limpar">
          Mostrar todos os hospitais
        </button>
      </div>

      <!-- Seção de Cobras -->
      <h2 class="secao-titulo">Serpentes Registradas</h2>
      <div id="cobras-container" class="grid-container">
        <!-- Os cards de cobras serão inseridos dinamicamente aqui -->
      </div>

      <!-- Seção de Hospitais -->
      <h2 class="secao-titulo">Hospitais com Soros Antiofídicos</h2>
      <div id="hospitais-container">
        <!-- Os cards dos hospitais serão inseridos dinamicamente aqui -->
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
