<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cobras do Ceará</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background-color: #f4f4f9;
      }
      .grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 20px;
      }
      .card {
        background: white;
        border-radius: 8px;
        padding: 15px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      .card img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 6px;
      }
      .card h3 {
        margin: 10px 0 5px;
      }
      .card p {
        font-size: 0.9em;
        color: #666;
      }
    </style>
  </head>
  <body>
    <h1>Cobras do Ceará</h1>
    <div id="cobras-container" class="grid-container"></div>

    <script src="script.js"></script>
  </body>
</html>
